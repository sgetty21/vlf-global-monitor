<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLF Global Monitor</title><style>
:root{color-scheme:dark;background:#080d14;color:#e3edf7;font:16px system-ui}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:clamp(1.6rem,4vw,2.5rem);margin:0}.muted{color:#91a4b9}.panel{background:#111b27;border:1px solid #29394b;border-radius:10px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}.tag{display:inline-block;border:1px solid #60758b;border-radius:5px;padding:3px 8px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:8px;border-bottom:1px solid #29394b}th:first-child,td:first-child{text-align:left}a{color:#83caff}.error{color:#ff9b9b}
</style></head><body><main><header><h1>VLF Global Monitor</h1><p class="muted">D-region spectral measurements · CRAAM type-A narrowband amplitude. A/B/C/D are human annotations only; no state is inferred from measurements.</p></header>
<section class="panel"><div id="status">Loading published validation records…</div><div id="runs" class="muted"></div></section><div id="content"></div><footer class="muted">Exploratory monitoring only. Measurements do not establish causation or provide forecasts.</footer></main>
<script>
const q=new URLSearchParams(location.search),base=(q.get('data')||'https://raw.githubusercontent.com/sgetty21/vlf-global-monitor/data').replace(/\/$/,'');
const $=x=>document.getElementById(x),esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(p){let r=await fetch(base+'/'+p,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()}
const good=a=>a&&['A','B','C','D'].includes(a.indicator)&&String(a.reviewer||'').trim()&&String(a.reviewed_at_utc||'').trim()&&String(a.provenance||'').trim();
function show(r,anns){let s=r.summary||{},rows=r.hourly||[],file=(r.source?.object_key||'').split('/').pop(),a=(anns.annotations||[]).find(x=>x.recording_file===file&&good(x));
$('content').innerHTML='<section class="panel"><div class="muted">Recording</div><h2>'+esc(file)+'</h2><p class="muted">Published '+esc(r.published_at_utc)+' · <a href="'+esc(r.workflow_url)+'">Validation run</a> · run '+esc(r.run_id)+' / attempt '+esc(r.run_attempt)+'</p><div class="grid">'+[['A · RMS energy',s.A],['T · spectral coherence',s.T],['τ · persistence',s.tau],['Complete hours',s.complete_hours]].map(x=>'<div class="panel"><div class="muted">'+x[0]+'</div><div class="metric">'+esc(x[1])+'</div></div>').join('')+'</div><p>Human indicator: '+(a?'<span class="tag">'+esc(a.indicator)+'</span>':'<span class="tag">Unassigned</span>')+'</p>'+(a?'<p>Reviewer: '+esc(a.reviewer)+' · '+esc(a.reviewed_at_utc)+'</p><p>'+esc(a.notes||'')+'</p><p class="muted">Provenance: '+esc(a.provenance)+'</p>':'<p class="muted">No complete valid human annotation. No indicator is inferred.</p>')+'</section><section class="panel"><h2>Hourly measurements</h2><div style="overflow-x:auto"><table><thead><tr><th>Hour UTC</th><th>A</th><th>T</th><th>τ</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+String(x.hour).padStart(2,'0')+'</td><td>'+esc(x.A)+'</td><td>'+esc(x.T)+'</td><td>'+esc(x.tau)+'</td></tr>').join('')+'</tbody></table></div></section><section class="panel"><h2>Validation provenance</h2><p class="muted">'+esc(r.source?.object_key)+' · CRAAM ETag '+esc(r.source?.object_etag)+'</p><p class="muted">Raw MAT file is not published. Validation report is retained with the run record.</p></section>'}
(async()=>{try{let i=await get('published/index.json');if(!Array.isArray(i.runs)||!i.runs.length){$('status').textContent='No successful validation records published yet.';return}let list=[...i.runs].sort((a,b)=>b.run_id-a.run_id||b.run_attempt-a.run_attempt),latest=list[0];$('runs').innerHTML='Published runs: '+list.map(x=>'<a href="#" data-path="'+esc(x.record)+'">'+esc(x.run_id)+' / '+esc(x.run_attempt)+'</a>').join(' · ');let [r,a]=await Promise.all([get('published/'+latest.record),get('published/annotations.json').catch(()=>({annotations:[]}))]);$('status').textContent='Latest successful published validation';show(r,a);$('runs').querySelectorAll('a').forEach(x=>x.onclick=async e=>{e.preventDefault();try{show(await get('published/'+x.dataset.path),a)}catch(z){$('status').textContent='Unable to load run: '+z.message}})}catch(e){$('status').innerHTML='<span class="error">Unable to load published data: '+esc(e.message)+'</span>'}})();
</script></body></html>
