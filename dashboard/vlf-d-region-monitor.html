<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VLF D-Region Spectral State Monitor</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=Chivo+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<style>
:root{color-scheme:dark;--bg:#080c12;--panel:#0e141d;--line:#1d2836;--ink:#d9e2ee;--mute:#7b8da3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Chivo',system-ui,sans-serif;margin:0}
.num{font-family:'Chivo Mono',ui-monospace,Menlo,monospace}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
@media(min-width:768px){.strip{grid-template-columns:repeat(24,1fr)}}
svg text{font-family:'Chivo Mono',monospace}
textarea:focus,button:focus-visible,input:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useMemo} = React;
const html = htm.bind(React.createElement);

const COL = {A:'#f43f5e',B:'#f59e0b',C:'#38bdf8',D:'#34d399',X:'#3b4757'};
const key = s => (String(s||'X')[0]||'X').toUpperCase();
const colorOf = s => COL[key(s)] || COL.X;

const BENCH = [
 {n:'Kelud Volcano (2014)',s:'Kelud',tau:976,A:.55,T:.042,state:'A'},
 {n:'Virginia Earthquake (2011)',s:'Virginia',tau:682,A:.49,T:.038,state:'A'},
 {n:'Solar Storm (2015)',s:'Solar',tau:627,A:.38,T:.021,state:'A'},
 {n:'SSW (Jan 2009)',s:'SSW',tau:422,A:.21,T:.088,state:'B'},
 {n:'Cyclone Pam (2015)',s:'Pam',tau:327,A:.18,T:.091,state:'B'},
 {n:'Hurricane Patricia (2015)',s:'Patricia',tau:321,A:.19,T:.115,state:'B'},
 {n:'Hurricane Sandy (2012)',s:'Sandy',tau:214,A:.15,T:.076,state:'B/C'},
 {n:'Hurricane Igor (2010)',s:'Igor',tau:188,A:.14,T:.062,state:'C'},
 {n:'Quiet Day (Control)',s:'Quiet',tau:12,A:.04,T:.004,state:'D'}
];

function sampleStorm(){
  const hours = [];
  for(let h=0;h<24;h++){
    const g = Math.exp(-Math.pow((h-14)/4.2,2));
    const w = Math.sin(h*1.7)*0.5+Math.cos(h*0.9)*0.5;
    const tau = Math.round(14 + 310*g + 8*w + (h>=9&&h<=19?20:0));
    const A = +(0.04 + 0.15*g + 0.006*w).toFixed(3);
    const T = +(0.006 + 0.09*g + 0.004*w).toFixed(3);
    hours.push({hour:h,tau,A,T,human_indicator:null});
  }
  return {name:'sample_storm_24h.json',hours,peak:null};
}

function normalize(raw, fallbackName){
  const obj = typeof raw==='string' ? JSON.parse(raw) : raw;
  if(obj===null || typeof obj!=='object') throw new Error('JSON must be an object or an array of hourly records.');
  const arr = Array.isArray(obj) ? obj : (obj.hourly||obj.hours||obj.data||obj.results||obj.timeline||[]);
  const num = v => (v===undefined||v===null||v==='') ? NaN : Number(v);
  const hours = arr.map((r,i)=>{
    const tau=num(r.tau??r.persistence), A=num(r.A??r.a??r.energy), T=num(r.T??r.t??r.coherence);
    const hour = num(r.hour??r.hr??r.h??i);
    const ok = [tau,A,T].every(Number.isFinite);
    return ok ? {hour:((hour%24)+24)%24,tau,A,T,human_indicator:r.human_indicator??null} : null;
  }).filter(Boolean);
  let peak = null;
  const p = !Array.isArray(obj) && obj.peak;
  if(p){
    const tau=num(p.tau??p.persistence),A=num(p.A??p.a??p.energy),T=num(p.T??p.t??p.coherence);
    if([tau,A,T].every(Number.isFinite)) peak={hour:p.hour??null,tau,A,T,human_indicator:p.human_indicator??null};
  }
  if(!peak && hours.length) peak = hours.reduce((m,r)=>r.tau>m.tau?r:m,hours[0]);
  if(!peak) throw new Error('No usable records found. Each hour needs tau, A and T (or persistence, energy, coherence).');
  const name = obj.file||obj.filename||obj.name||obj.event||fallbackName||'pasted_batch.json';
  return {name,hours,peak};
}

function Badge({state,big}){
  const k=key(state), c=colorOf(state), mixed=String(state).includes('/');
  const bg = mixed ? `linear-gradient(90deg,${colorOf(state)},${colorOf(String(state).split('/')[1])})` : c;
  return html`<span className=${'inline-flex items-center gap-2 rounded px-2.5 py-1 font-semibold '+(big?'text-lg':'text-xs')} style=${{background:c+'22',border:'1px solid '+c,color:c}}>
    <i style=${{width:8,height:8,borderRadius:99,background:bg,display:'inline-block'}}></i>State ${state}</span>`;
}

function Kpi({label,value,sub,children}){
  return html`<div className="panel p-3 sm:p-4 min-w-0">
    <div className="text-xs text-[color:var(--mute)] mb-1.5">${label}</div>
    ${children || html`<div className="num text-xl sm:text-2xl font-semibold truncate">${value}</div>`}
    ${sub && html`<div className="text-xs text-[color:var(--mute)] mt-1">${sub}</div>`}
  </div>`;
}

function Timeline({hours}){
  const byH = {}; hours.forEach(r=>{ if(!byH[r.hour]||r.tau>byH[r.hour].tau) byH[r.hour]=r; });
  return html`<div className="strip">
    ${Array.from({length:24},(_,h)=>{
      const r=byH[h], c=r&&r.human_indicator?colorOf(r.human_indicator):COL.X;
      return html`<div key=${h} title=${r?`Hour ${h}: tau ${Math.round(r.tau)}, A ${r.A.toFixed(4)}, T ${r.T.toFixed(4)}${r.human_indicator?`, human indicator ${r.human_indicator}`:''}`:`Hour ${h}: no data`}
        className="rounded-sm text-center py-2" style=${{background:r?c+'33':'#141c27',border:'1px solid '+(r?c:'#1d2836')}}>
        <div className="num text-[11px]" style=${{color:r?c:'#5b6b80'}}>${String(h).padStart(2,'0')}</div>
        <div className="num text-[10px] font-semibold" style=${{color:r?c:'#5b6b80'}}>${r?(r.human_indicator||'·'):'–'}</div>
      </div>`;})}
  </div>`;
}

function LineChart({hours}){
  const [hov,setHov]=useState(null);
  const W=640,H=300,m={l:46,r:50,t:16,b:30};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const rows=[...hours].sort((a,b)=>a.hour-b.hour);
  if(!rows.length) return html`<div className="text-sm text-[color:var(--mute)] py-10 text-center">This batch has no hourly records, so only the peak is shown.</div>`;
  const tMax=Math.max(100,Math.ceil(Math.max(...rows.map(r=>r.tau))/100)*100);
  const cMax=Math.max(0.05,Math.ceil(Math.max(...rows.map(r=>r.T))*20)/20);
  const x=h=>m.l+h/23*iw, yT=v=>m.t+ih-v/tMax*ih, yC=v=>m.t+ih-v/cMax*ih;
  const path=(f,k)=>rows.map((r,i)=>(i?'L':'M')+x(r.hour).toFixed(1)+','+f(r[k]).toFixed(1)).join('');
  const onMove=e=>{
    const b=e.currentTarget.getBoundingClientRect();
    const px=(e.clientX-b.left)/b.width*W;
    const h=Math.max(0,Math.min(23,Math.round((px-m.l)/iw*23)));
    setHov(rows.find(r=>r.hour===h)||{hour:h});
  };
  return html`<div>
    <div className="num text-xs h-5 mb-1 text-[color:var(--mute)]">
      ${hov ? (hov.tau!==undefined ? html`<span>H${String(hov.hour).padStart(2,'0')} · <span style=${{color:'#38bdf8'}}>τ ${Math.round(hov.tau)}</span> · <span style=${{color:'#f59e0b'}}>T ${hov.T.toFixed(3)}</span> · A ${hov.A.toFixed(3)}${hov.human_indicator?` · Human indicator ${hov.human_indicator}`:''}</span>` : `H${String(hov.hour).padStart(2,'0')} · no data`) : 'Hover or touch the chart to read an hour'}
    </div>
    <svg viewBox=${`0 0 ${W} ${H}`} className="w-full h-auto touch-none" onPointerMove=${onMove} onPointerLeave=${()=>setHov(null)}>
      ${[0,.25,.5,.75,1].map(f=>html`<g key=${f}>
        <line x1=${m.l} x2=${W-m.r} y1=${m.t+ih*(1-f)} y2=${m.t+ih*(1-f)} stroke="#1d2836"/>
        <text x=${m.l-6} y=${m.t+ih*(1-f)+4} textAnchor="end" fontSize="10" fill="#38bdf8">${Math.round(tMax*f)}</text>
        <text x=${W-m.r+6} y=${m.t+ih*(1-f)+4} fontSize="10" fill="#f59e0b">${(cMax*f).toFixed(3)}</text></g>`)}
      ${[0,3,6,9,12,15,18,21,23].map(h=>html`<text key=${h} x=${x(h)} y=${H-10} textAnchor="middle" fontSize="10" fill="#7b8da3">${String(h).padStart(2,'0')}</text>`)}
      <path d=${path(yT,'tau')} fill="none" stroke="#38bdf8" strokeWidth="2.2" strokeLinejoin="round"/>
      <path d=${path(yC,'T')} fill="none" stroke="#f59e0b" strokeWidth="2.2" strokeLinejoin="round" strokeDasharray="5 3"/>
      ${rows.map(r=>html`<g key=${r.hour}><circle cx=${x(r.hour)} cy=${yT(r.tau)} r="2.6" fill="#38bdf8"/><circle cx=${x(r.hour)} cy=${yC(r.T)} r="2.6" fill="#f59e0b"/></g>`)}
      ${hov && html`<line x1=${x(hov.hour)} x2=${x(hov.hour)} y1=${m.t} y2=${m.t+ih} stroke="#7b8da3" strokeDasharray="2 3"/>`}
      <text x=${m.l} y="10" fontSize="10" fill="#38bdf8">τ persistence</text>
      <text x=${W-m.r} y="10" textAnchor="end" fontSize="10" fill="#f59e0b">T coherence</text>
    </svg></div>`;
}

function Scatter({batch}){
  const W=640,H=440,m={l:50,r:16,t:16,b:44};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const xMax=0.14,yMax=0.6;
  const x=v=>m.l+Math.min(v,xMax)/xMax*iw, y=v=>m.t+ih-Math.min(v,yMax)/yMax*ih;
  const off={Kelud:[8,-8],Virginia:[8,4],Solar:[8,4],SSW:[8,-8],Pam:[-6,16],Patricia:[-6,-10],Sandy:[-8,17],Igor:[-8,-10],Quiet:[8,-8]};
  const pk=batch.peak;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} className="w-full h-auto">
    <rect x=${m.l} y=${m.t} width=${x(0.06)-m.l} height=${y(0.3)-m.t} fill="#f43f5e" opacity="0.07"/>
    <rect x=${x(0.06)} y=${y(0.3)} width=${W-m.r-x(0.06)} height=${m.t+ih-y(0.3)} fill="#f59e0b" opacity="0.06"/>
    <text x=${m.l+8} y=${m.t+16} fontSize="10" fill="#f43f5e" opacity="0.8">impulsive forcing zone</text>
    <text x=${W-m.r-8} y=${y(0.3)+ih*0.0+(m.t+ih-y(0.3))-8} textAnchor="end" fontSize="10" fill="#f59e0b" opacity="0.8">organized wave zone</text>
    ${[0,.1,.2,.3,.4,.5,.6].map(v=>html`<g key=${'y'+v}><line x1=${m.l} x2=${W-m.r} y1=${y(v)} y2=${y(v)} stroke="#1d2836"/><text x=${m.l-6} y=${y(v)+4} textAnchor="end" fontSize="10" fill="#7b8da3">${v.toFixed(1)}</text></g>`)}
    ${[0,.02,.04,.06,.08,.1,.12,.14].map(v=>html`<g key=${'x'+v}><line y1=${m.t} y2=${m.t+ih} x1=${x(v)} x2=${x(v)} stroke="#1d2836"/><text x=${x(v)} y=${H-26} textAnchor="middle" fontSize="10" fill="#7b8da3">${v.toFixed(2)}</text></g>`)}
    <text x=${m.l+iw/2} y=${H-8} textAnchor="middle" fontSize="11" fill="#d9e2ee">Coherence T</text>
    <text transform=${`translate(12 ${m.t+ih/2}) rotate(-90)`} textAnchor="middle" fontSize="11" fill="#d9e2ee">Energy A</text>
    ${BENCH.map(b=>{const o=off[b.s]||[8,4];return html`<g key=${b.s}>
      <circle cx=${x(b.T)} cy=${y(b.A)} r="5" fill=${colorOf(b.state)} opacity="0.55"/>
      <text x=${x(b.T)+o[0]} y=${y(b.A)+o[1]} fontSize="10" fill="#9fb0c4" textAnchor=${o[0]<0?'end':'start'}>${b.s}</text></g>`;})}
    ${batch.hours.map((r,i)=>html`<circle key=${i} cx=${x(r.T)} cy=${y(r.A)} r="4" fill="none" stroke="#fff" strokeWidth="1.4" opacity="0.8"><title>${`H${String(r.hour).padStart(2,'0')} · T ${r.T.toFixed(3)} · A ${r.A.toFixed(3)} · State ${r.state}`}</title></circle>`)}
    <g>
      <circle cx=${x(pk.T)} cy=${y(pk.A)} r="11" fill="none" stroke=${COL.X} strokeWidth="2.5"/>
      <circle cx=${x(pk.T)} cy=${y(pk.A)} r="4.5" fill="#fff"/>
      <text x=${x(pk.T)} y=${y(pk.A)-17} textAnchor="middle" fontSize="11" fontWeight="600" fill="#fff">PEAK</text>
    </g>
  </svg>`;
}

function LoadModal({onClose,onLoad,onReset}){
  const [text,setText]=useState('');
  const [err,setErr]=useState('');
  const [fname,setFname]=useState('');
  const apply=(raw,name)=>{ try{ onLoad(normalize(raw,name)); onClose(); }catch(e){ setErr(e.message); } };
  const onFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ setFname(f.name); setText(String(rd.result)); apply(String(rd.result),f.name); };
    rd.onerror=()=>setErr('Could not read that file.');
    rd.readAsText(f);
  };
  return html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style=${{background:'rgba(3,6,10,.8)'}} onClick=${onClose}>
    <div className="panel w-full sm:max-w-xl max-h-[92%] overflow-auto p-4 sm:p-5" onClick=${e=>e.stopPropagation()}>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-lg font-semibold">Load new batch</h2>
        <button onClick=${onClose} className="text-[color:var(--mute)] px-2 py-1" aria-label="Close">✕</button>
      </div>
      <label className="block text-sm mb-1 text-[color:var(--mute)]">Upload a .json file from the VLF engine</label>
      <input type="file" accept=".json,application/json" onChange=${onFile} className="block w-full text-sm mb-4 file:mr-3 file:rounded file:border-0 file:bg-sky-500/20 file:text-sky-300 file:px-3 file:py-2"/>
      <label className="block text-sm mb-1 text-[color:var(--mute)]">Or paste raw JSON</label>
      <textarea value=${text} onChange=${e=>{setText(e.target.value);setErr('');}} rows="8" spellCheck="false"
        placeholder=${'{"file":"event.json","hourly":[{"hour":0,"tau":40,"A":0.05,"T":0.01,"state":"D"}, …]}'}
        className="num w-full rounded p-2 text-xs bg-[#080c12] border border-[color:var(--line)]"></textarea>
      <p className="text-xs text-[color:var(--mute)] mt-2">Accepted: an array, or an object with <span className="num">hourly</span> / <span className="num">hours</span> / <span className="num">data</span>. Fields per hour: <span className="num">hour, tau, A, T</span>; optional <span className="num">human_indicator</span> is a human-entered annotation. No indicator is inferred from the metrics. An optional <span className="num">peak</span> object overrides the highest-τ hour.</p>
      ${err && html`<div className="mt-3 text-sm rounded p-2" style=${{background:'#f43f5e22',border:'1px solid #f43f5e',color:'#fda4af'}}>${err}</div>`}
      <div className="flex flex-wrap gap-2 mt-4">
        <button onClick=${()=>apply(text,fname)} disabled=${!text.trim()} className="rounded px-4 py-2 text-sm font-semibold bg-sky-500 text-slate-950 disabled:opacity-40">Update dashboard</button>
        <button onClick=${()=>{onReset();onClose();}} className="rounded px-4 py-2 text-sm border border-[color:var(--line)]">Restore sample storm</button>
      </div>
    </div></div>`;
}

function App(){
  const [batch,setBatch]=useState(()=>sampleStorm());
  const [open,setOpen]=useState(false);
  const pk=batch.peak || batch.hours.reduce((m,r)=>r.tau>m.tau?r:m,batch.hours[0]);
  const b = {...batch,peak:pk};
  
  return html`<div className="grid-bg min-h-screen">
  <div className="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
    <header className="flex items-start justify-between gap-3 mb-4">
      <div className="min-w-0">
        <h1 className="text-xl sm:text-3xl font-extrabold leading-tight">VLF D-Region Spectral State Monitor</h1>
        <p className="text-xs sm:text-sm text-[color:var(--mute)] mt-1">Hourly persistence, energy and coherence, classified into four regimes.</p>
      </div>
      <button onClick=${()=>setOpen(true)} className="shrink-0 rounded px-3 sm:px-4 py-2 text-sm font-semibold bg-sky-500 text-slate-950">Load new batch</button>
    </header>

    <section className="grid grid-cols-2 lg:grid-cols-5 gap-2 sm:gap-3 mb-3 sm:mb-4">
      <div className="col-span-2 lg:col-span-1"><${Kpi} label="Active file" value=${b.name} sub=${b.hours.length+' hourly records'}/></div>
      <${Kpi} label="Peak human indicator"><${Badge} state=${pk.human_indicator||'Not assigned'} big=${true}/><div className="text-xs text-[color:var(--mute)] mt-1">${pk.human_indicator?'Human-entered; interpretation pending':'No human indicator supplied'}</div><//>
      <${Kpi} label="Peak persistence (τ)" value=${Math.round(pk.tau)} sub=${pk.hour!=null?'at hour '+String(pk.hour).padStart(2,'0'):''}/>
      <${Kpi} label="Peak energy (A)" value=${pk.A.toFixed(3)}/>
      <div className="col-span-2 lg:col-span-1"><${Kpi} label="Peak coherence (T)" value=${pk.T.toFixed(3)}/></div>
    </section>

    <section className="panel p-3 sm:p-4 mb-3 sm:mb-4">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h2 className="font-semibold">24-hour measurement timeline</h2>
        <div className="text-xs text-[color:var(--mute)]">A/B labels are human annotations, not metric-derived classes</div>
      </div>
      <${Timeline} hours=${b.hours}/>
      <div className="mt-5"><${LineChart} hours=${b.hours}/></div>
    </section>

    <section className="grid lg:grid-cols-3 gap-3 sm:gap-4 mb-3 sm:mb-4">
      <div className="panel p-3 sm:p-4 lg:col-span-2">
        <h2 className="font-semibold">Regime separation</h2>
        <p className="text-xs text-[color:var(--mute)] mb-2">Coherence T against energy A. Filled dots are the nine reference events; white rings are this batch’s hours.</p>
        <${Scatter} batch=${b}/>
      </div>
      <div className="panel p-3 sm:p-4">
        <h2 className="font-semibold mb-2">Reference benchmarks</h2>
        <div className="overflow-x-auto"><table className="w-full text-xs num">
          <thead><tr className="text-[color:var(--mute)] text-left"><th className="py-1 pr-2 font-normal">Event</th><th className="pr-2 font-normal">τ</th><th className="pr-2 font-normal">A</th><th className="pr-2 font-normal">T</th><th className="font-normal">St</th></tr></thead>
          <tbody>${BENCH.map(r=>html`<tr key=${r.s} className="border-t border-[color:var(--line)]">
            <td className="py-1.5 pr-2 font-sans whitespace-nowrap">${r.n}</td><td className="pr-2">${r.tau}</td><td className="pr-2">${r.A.toFixed(2)}</td><td className="pr-2">${r.T.toFixed(3)}</td>
            <td style=${{color:colorOf(r.state)}} className="font-semibold whitespace-nowrap">${r.state}</td></tr>`)}</tbody></table></div>
        <p className="text-xs text-[color:var(--mute)] mt-3">Legacy reference labels are retained as historical annotations; their interpretation and provenance require human review. This dashboard does not infer A/B/C/D from A, T or τ.</p>
      </div>
    </section>
  </div>
  ${open && html`<${LoadModal} onClose=${()=>setOpen(false)} onLoad=${setBatch} onReset=${()=>setBatch(sampleStorm())}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
