name: Historical ingestion code checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts vlf_json_exporter.py tests
      - name: Run archive policy tests
        run: python -m unittest discover -s tests -v
