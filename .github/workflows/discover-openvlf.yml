name: Discover Open VLF archive

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect public CRAAM S3 archive
        run: |
          python scripts/discover_openvlf_s3.py \
            --prefix "2015/10/22/narrowband/" \
            --output data/archive_inventory.json

      - name: Save archive inventory
        uses: actions/upload-artifact@v4
        with:
          name: openvlf-archive-inventory
          path: data/archive_inventory.json
          if-no-files-found: error
          retention-days: 30
