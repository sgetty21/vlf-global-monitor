name: Validate Patricia NAA archive reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt

      - name: Download and process verified CRAAM object
        run: python scripts/validate_patricia_archive.py --output-dir data/patricia-validation

      - name: Upload validation outputs (raw MAT is not retained)
        uses: actions/upload-artifact@v4
        with:
          name: patricia-naa-validation
          path: data/patricia-validation/
          if-no-files-found: error
          retention-days: 30
