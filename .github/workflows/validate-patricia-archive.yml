name: Validate Patricia NAA archive reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/validate_patricia_archive.py"
      - "vlf_json_exporter.py"
      - ".github/workflows/validate-patricia-archive.yml"

permissions:
  contents: write

concurrency:
  group: patricia-publication
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate verified CRAAM object
        run: python scripts/validate_patricia_archive.py --output-dir data/patricia-validation
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: patricia-naa-validation
          path: data/patricia-validation/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare immutable publication
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CREATED_AT
          python scripts/publish_validation_record.py \
            --input data/patricia-validation/patricia_2015_naa_eacf_validation.json \
            --report data/patricia-validation/validation_report.json \
            --published-dir /tmp/vlf-publication/published \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --run-url "$RUN_URL" --created-at "$CREATED_AT"
      - name: Append publication to data branch
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data
          git checkout -B publish-data FETCH_HEAD
          mkdir -p published/runs
          NEW_RECORD="/tmp/vlf-publication/published/runs/$RUN_ID-$RUN_ATTEMPT.json"
          TARGET_RECORD="published/runs/$RUN_ID-$RUN_ATTEMPT.json"
          if [ -e "$TARGET_RECORD" ]; then
            if ! cmp -s "$NEW_RECORD" "$TARGET_RECORD"; then
              echo "Immutable record conflict for $TARGET_RECORD" >&2
              exit 1
            fi
          else
            cp "$NEW_RECORD" "$TARGET_RECORD"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("published/index.json")
          index=json.loads(p.read_text()) if p.exists() else {"schema_version":1,"runs":[]}
          record=f"runs/{__import__('os').environ['RUN_ID']}-{__import__('os').environ['RUN_ATTEMPT']}.json"
          item={"run_id":int(__import__('os').environ["RUN_ID"]),"run_attempt":int(__import__('os').environ["RUN_ATTEMPT"]),"record":record}
          old=[x for x in index["runs"] if (x.get("run_id"),x.get("run_attempt"))==(item["run_id"],item["run_attempt"])]
          if old and old[0]!=item: raise SystemExit("Index entry conflict; refusing to overwrite.")
          if not old: index["runs"].append(item)
          index["runs"].sort(key=lambda x:(x["run_id"],x["run_attempt"]))
          p.write_text(json.dumps(index,indent=2)+"\n")
          PY
          git add published/index.json "published/runs/$RUN_ID-$RUN_ATTEMPT.json"
          git diff --cached --quiet && exit 0
          git commit -m "Publish Patricia validation run $RUN_ID attempt $RUN_ATTEMPT"
          git push origin HEAD:data
